<text x="1552" y="520" font-size="17" font-weight="700" fill="#FFFFFF">Aviso en la app</text>
<text x="1552" y="541" font-size="14" fill="#8E95A3">con el veredicto y los motivos</text>
<circle cx="1536" cy="576" r="4" fill="#8E95A3"/>
<text x="1552" y="582" font-size="17" font-weight="700" fill="#FFFFFF">Pantalla que explica el porqué</text>
<text x="1552" y="603" font-size="14" fill="#8E95A3">no bloquea: el cliente decide</text>
<circle cx="1536" cy="638" r="4" fill="#8E95A3"/>
<text x="1552" y="644" font-size="17" font-weight="700" fill="#FFFFFF">Voz de Centinela</text>
<text x="1552" y="665" font-size="14" fill="#8E95A3">ElevenLabs, o la voz del navegador</text>
<circle cx="1536" cy="700" r="4" fill="#8E95A3"/>
<text x="1552" y="706" font-size="17" font-weight="700" fill="#FFFFFF">Aviso al familiar de confianza</text>
<text x="1552" y="727" font-size="14" fill="#8E95A3">si el cliente lo ha designado</text>
<circle cx="1536" cy="762" r="4" fill="#8E95A3"/>
<text x="1552" y="768" font-size="17" font-weight="700" fill="#FFFFFF">Gráfica a 30 años y traspaso</text>
<text x="1552" y="789" font-size="14" fill="#8E95A3">solo en el camino del folleto</text>
<circle cx="1536" cy="824" r="4" fill="#8E95A3"/>
<text x="1552" y="830" font-size="17" font-weight="700" fill="#FFFFFF">Registro de cada decisión</text>
<text x="1552" y="851" font-size="14" fill="#8E95A3">encadenado con SHA-256</text>
<text x="60" y="934" font-size="14" font-weight="700" letter-spacing="2.2" fill="#C9CED8">SI ALGO FALLA, CENTINELA SIGUE</text>
<rect x="60" y="950" width="332" height="74" rx="14" fill="#15171E" stroke="#2A2E3A" stroke-width="1.5"/>
<text x="76" y="981" font-size="16" font-weight="700" fill="#FFFFFF">Claude no responde en 8 s</text>
<text x="76" y="1004" font-size="14" fill="#8E95A3">El veredicto sale solo con reglas, y se indica</text>
<rect x="412" y="950" width="332" height="74" rx="14" fill="#15171E" stroke="#2A2E3A" stroke-width="1.5"/>
<text x="428" y="981" font-size="16" font-weight="700" fill="#FFFFFF">ElevenLabs no está disponible</text>
<text x="428" y="1004" font-size="14" fill="#8E95A3">Habla y transcribe el navegador</text>
<rect x="764" y="950" width="332" height="74" rx="14" fill="#15171E" stroke="#2A2E3A" stroke-width="1.5"/>
<text x="780" y="981" font-size="16" font-weight="700" fill="#FFFFFF">El MCP no responde en 4,5 s</text>
<text x="780" y="1004" font-size="14" fill="#8E95A3">Se usa una copia guardada del catálogo</text>
<rect x="1116" y="950" width="332" height="74" rx="14" fill="#15171E" stroke="#2A2E3A" stroke-width="1.5"/>
<text x="1132" y="981" font-size="16" font-weight="700" fill="#FFFFFF">Además: servidor MCP propio</text>
<text x="1132" y="1004" font-size="14" fill="#8E95A3">Tres herramientas para otros asistentes</text>
