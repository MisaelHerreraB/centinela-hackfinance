<text x="638" y="689" font-size="22" font-weight="700" fill="#FFFFFF">Comprobación</text>
<text x="638" y="717" font-size="16" fill="#C9CED8">Limpia los números.</text>
<text x="638" y="739" font-size="16" fill="#C9CED8">Sin comisión, se para aquí</text>
<rect x="905" y="635" width="240" height="140" rx="16" fill="#12142A" stroke="#6D7CFF" stroke-width="2" stroke-dasharray="7 5"/>
<text x="923" y="659" font-size="12" font-weight="700" letter-spacing="1" fill="#6D7CFF">SERVICIO EXTERNO</text>
<text x="923" y="689" font-size="22" font-weight="700" fill="#FFFFFF">MCP de MyInvestor</text>
<text x="923" y="717" font-size="16" fill="#C9CED8">Fondo indexado más</text>
<text x="923" y="739" font-size="16" fill="#C9CED8">barato de esa categoría</text>
<rect x="1200" y="635" width="250" height="200" rx="16" fill="#0F1A15" stroke="#30D158" stroke-width="2"/>
<text x="1218" y="659" font-size="12" font-weight="700" letter-spacing="1" fill="#30D158">CÓDIGO DE CENTINELA</text>
<text x="1218" y="689" font-size="22" font-weight="700" fill="#FFFFFF">Motor financiero</text>
<text x="1218" y="717" font-size="16" fill="#C9CED8">Proyección a 30 años</text>
<text x="1218" y="739" font-size="16" fill="#C9CED8">e impuestos del traspaso</text>
<text x="1218" y="772" font-size="13" fill="#8E95A3">Decide:</text>
