services:
  centinela:
    build: .
    container_name: centinela-myinvestor
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - CENTINELA_KEYS_FROM_DOCKER_HOST=1
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-}
      - MYINVESTOR_MCP_URL=${MYINVESTOR_MCP_URL:-https://mcp.myinvestor.es/mcp}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - ELEVENLABS_API_KEY=${ELEVENLABS_API_KEY:-}
    restart: unless-stopped
